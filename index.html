<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <div class="page">

    <header class="app-header">
      <h1>Ledger</h1>
      <p class="app-sub">A running list of what needs doing.</p>
    </header>

    <form id="task-form" class="task-form" novalidate>
      <div class="field-row">
        <input
          type="text"
          id="task-input"
          class="task-input"
          placeholder="What needs to get done?"
          maxlength="120"
          autocomplete="off"
        >
        <button type="submit" class="btn btn-add">Add task</button>
      </div>
      <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button class="filter-btn is-active" data-filter="all">All <span id="count-all" class="count">0</span></button>
      <button class="filter-btn" data-filter="active">Active <span id="count-active" class="count">0</span></button>
      <button class="filter-btn" data-filter="completed">Done <span id="count-completed" class="count">0</span></button>
    </nav>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state">Nothing here yet. Add your first task above.</p>

  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
